# Secrets écrits en dur. Les motifs sont volontairement précis (préfixes de fournisseurs) pour éviter les faux positifs ;
# Gitleaks, s'il est installé, couvre des centaines d'autres formats.

- id: DOT-SEC-001
  severity: critical
  category: secret
  refs: [A07:2025, NHI2:2025, CWE-798]
  detector:
    type: regex
    files: ["**/*.{js,jsx,ts,tsx,mjs,cjs,vue,svelte,astro,py,rb,php,go,java,kt,cs,rs,json,yml,yaml,toml,ini,properties,xml}", "**/.env*"]
    exclude: ["**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/*.min.js", "**/*.map"]
    skipUntrackedEnv: true
    pattern: '(?<secret>\b(?:AKIA[0-9A-Z]{16}|[sr]k_live_[0-9A-Za-z]{20,}|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{40,}|sk-ant-[A-Za-z0-9_-]{30,}|sk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{40,}|xox[baprs]-[A-Za-z0-9-]{20,}|SG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}))'
    ignoreIf: ['EXAMPLE', '(?:x{6,}|X{6,})', '<[^>]*>']
    secretGroup: secret
  text:
    en:
      title: Hardcoded API key
      explanation: A key in the code ends up in git history; bots crawl GitHub nonstop and use leaked keys within minutes.
      fix: Revoke the key with the provider, create a new one, and read it from an environment variable (process.env, os.environ) kept in an untracked .env.

- id: DOT-SEC-002
  severity: critical
  category: secret
  refs: [A04:2025, NHI2:2025, CWE-321]
  detector:
    type: regex
    files: ["**/*"]
    exclude: ["**/*.pub"]
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----'
  text:
    en:
      title: Private key in the project
      explanation: With this key, anyone can impersonate your server or reach whatever it protects.
      fix: Treat the key as compromised and generate a new one. Keep keys out of the repo (secrets manager, or a git-ignored file).

- id: DOT-SEC-003
  severity: high
  category: secret
  refs: [A07:2025, CWE-259]
  detector:
    type: regex
    files: ["**/*.{js,jsx,ts,tsx,mjs,cjs,vue,svelte,astro,py,rb,php,go,java,kt,cs,json,yml,yaml,toml,ini,properties}", "**/.env*"]
    exclude: ["**/package-lock.json", "**/pnpm-lock.yaml", "**/*.min.js", "**/i18n/**", "**/locales/**", "**/messages/**"]
    skipUntrackedEnv: true
    flags: i
    pattern: '(?<![\w-])(?:[a-z0-9]+_)*(?:password|passwd|pwd|pass|mot_?de_?passe)\b["'']?\s*[:=]\s*["''](?<secret>[^"''\s]{6,})["'']'
    ignoreIf:
      - 'process\.env|os\.environ|getenv|import\.meta\.env|\$\{'
      - '["''](?:password|passwd|pwd|\*+|x+|changeme|placeholder|your[_-]?password|example|<[^>]+>)["'']'
      - 'type\s*[:=]'
      - '[:=]\s*["''][^"'']*(?:password|passwd|pwd)[^"'']*["'']'
      - 'auto[cC]omplete|(?:new|current)-password'
    secretGroup: secret
  text:
    en:
      title: Plaintext password
      explanation: A password in the code is readable by anyone who sees the repo, and it stays in git history even after you delete it.
      fix: Replace it with an environment variable and change the password (treat the old one as known).

- id: DOT-SEC-004
  severity: critical
  category: secret
  refs: [A02:2025, NHI2:2025, CWE-200]
  detector:
    type: regex
    files: ["**/.env*", "**/*.{js,jsx,ts,tsx,mjs,cjs,vue,svelte,astro}"]
    pattern: '\b(?:NEXT_PUBLIC|VITE|EXPO_PUBLIC|REACT_APP|NUXT_PUBLIC|PUBLIC)_[A-Z0-9_]*(?:SECRET|PRIVATE|SERVICE_ROLE|SERVICE_KEY|PASSWORD|PASSWD)[A-Z0-9_]*'
  text:
    en:
      title: Secret in a public variable
      explanation: NEXT_PUBLIC_, VITE_, EXPO_PUBLIC_… variables are copied into the JavaScript sent to the browser; any visitor can read them.
      fix: Rename the variable without the public prefix and use it on the server only (API route, server action, server function).

- id: DOT-SEC-005
  severity: critical
  category: secret
  refs: [A01:2025, NHI5:2025, CWE-798]
  detector:
    type: regex
    files: ["**/*.{js,jsx,ts,tsx,mjs,vue,svelte}"]
    fileMustMatch: '^\s*["'']use client["'']'
    pattern: 'SUPABASE_SERVICE_ROLE|service_role'
    ignoreIf: ['^\s*(?://|/?\*)']
  text:
    en:
      title: Supabase service_role key in client code
      explanation: The service_role key bypasses every RLS policy; in a "use client" component it ships to the browser and gives full access to your database.
      fix: Use only the anon key on the client. Keep the service_role key in server code (API route, server action) and rotate it if it was already published.

- id: DOT-SEC-006
  severity: high
  category: secret
  refs: [A04:2025, NHI2:2025, CWE-321]
  detector:
    type: regex
    files: ["**/*.{js,jsx,ts,tsx,mjs,cjs,py}"]
    pattern: '\bjwt\.(?:sign|verify|encode|decode)\([^,]+,\s*["''](?<secret>[^"'']{4,})["'']'
    secretGroup: secret
  text:
    en:
      title: Hardcoded JWT signing key
      explanation: Whoever knows this key can mint valid tokens and log in as any user, admins included.
      fix: Generate a long random key (at least 32 bytes), keep it in an environment variable and invalidate existing tokens.
