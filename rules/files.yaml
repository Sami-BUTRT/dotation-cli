# Fichiers sensibles versionnés et .gitignore.

- id: DOT-CFG-001
  severity: critical
  category: config
  refs: [A02:2025, NHI2:2025, CWE-540]
  detector:
    type: tracked-file
    files: [".env", ".env.*"]
    exclude: [".env*.example", ".env*.sample", ".env*.template", ".env*.dist", ".env*.default", ".env*.defaults", "**/fixtures/**"]
    publicEnvSeverity: low
  text:
    en:
      title: .env file committed to git
      explanation: A .env usually holds keys and passwords; once committed, anyone with repo access can read it, forever (history).
      fix: "Stop tracking it (git rm --cached .env), add .env to .gitignore, then rotate the secrets it contained. Share a .env.example without values instead."

- id: DOT-CFG-002
  severity: critical
  category: config
  refs: [A04:2025, NHI2:2025, CWE-321]
  detector:
    type: tracked-file
    files: ["*.pem", "*.key", "*.p12", "*.pfx", "*.jks", "id_rsa", "id_dsa", "id_ecdsa", "id_ed25519", "*-firebase-adminsdk-*.json", "serviceAccountKey.json", "*.keystore"]
    exclude: ["**/fixtures/**"]
  text:
    en:
      title: Key file committed to git
      explanation: Private keys, certificates with keys and service accounts give direct access to your servers or cloud.
      fix: "Stop tracking the file (git rm --cached), add it to .gitignore and replace the key: it is already in the history."

- id: DOT-CFG-003
  severity: medium
  category: config
  refs: [A02:2025, NHI2:2025, CWE-540]
  detector:
    type: not-gitignored
    path: .env
    when: ["package.json", "requirements.txt", "pyproject.toml", "composer.json", "Gemfile", "go.mod", ".env*"]
  text:
    en:
      title: .env missing from .gitignore
      explanation: Without this line, the first "git add ." will push your keys into the repo.
      fix: "Add these lines to your .gitignore: .env and .env*.local (keep a .env.example without values)."
