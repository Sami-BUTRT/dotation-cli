# Réglages dangereux dans le code.

- id: DOT-CODE-001
  severity: high
  category: code
  refs: [A04:2025, CWE-295]
  detector:
    type: regex
    files: ["**/*.{js,jsx,ts,tsx,mjs,cjs,py}", "**/.env*"]
    pattern: 'NODE_TLS_REJECT_UNAUTHORIZED\s*[=:]\s*["'']?0|rejectUnauthorized\s*:\s*false|\bverify\s*=\s*False\b'
  text:
    en:
      title: TLS verification disabled
      explanation: Without certificate checks, someone on the network can sit between your app and the server and read or change the traffic.
      fix: Remove this setting. If an internal certificate is the issue, provide its authority (ca option, or NODE_EXTRA_CA_CERTS) instead of turning checks off.

- id: DOT-CODE-002
  severity: high
  category: code
  refs: [A02:2025, CWE-489]
  detector:
    type: regex
    files: ["**/*.py"]
    pattern: '\.run\([^)]*\bdebug\s*=\s*True|^\s*DEBUG\s*=\s*True\b'
  text:
    en:
      title: Debug mode enabled
      explanation: In debug mode, an error shows code, variables and sometimes a console that can run commands on the server.
      fix: Read this setting from the environment (DEBUG = os.environ.get("DEBUG") == "1") and keep it off in production.

- id: DOT-SEC-007
  severity: critical
  category: code
  refs: [A03:2025, A08:2025, CWE-506]
  detector:
    type: hidden-code
    files: ["**/*.{js,jsx,ts,tsx,mjs,cjs,vue,svelte,py,json,sh}"]
    exclude: ["**/*.min.js", "**/*.map", "**/package-lock.json"]
    minSpaces: 150
  text:
    en:
      title: Code hidden at the end of a line
      explanation: Code sits after hundreds of spaces, invisible in your editor. This is the signature of booby-trapped fake "starter" projects; a config file such as postcss.config.mjs runs as soon as you "npm run dev".
      fix: "Do not run this project (no npm install, no npm run dev). Remove the end of that line, check the git history, and if you already ran it: change your passwords, keys and tokens from another machine."
